<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="icon" href="icons/favicon-16x16.png">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="/js/script.js"></script>

</head>
<body>
    <main>
        <img src="#" alt="pokemon" class="pokemon_image">
        <img src="images/pokedex.png" alt="Pokedex" class="pokedex">
        <h1 class="pokemon_data">
            <span class="pokemon_number"></span>
            <span class="pokemon_name"></span>
        </h1>

        <form class="form">
            <input type="search" 
            class="input_search" 
            placeholder="Name or Number"
            required>
        </form>
           
        <div class="types">
            <input type="text" class="type1" readonly>
            <input type="text" class="type2" readonly>
        </div>


        <div class="buttons">
            <button class="button btn-prev">&lt; Prev</button>
            <button class="button btn-next">Next &gt;</button>
        </div>
    </main>
    
</body>
</html>
